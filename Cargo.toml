[package]
name = "ripwire"
version = "0.2.0"
edition = "2024"
authors = ["Cason Adams"]
description = "High-throughput agent context router and deterministic static analysis engine"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/casonadams/ripwire"
documentation = "https://docs.rs/ripwire"
keywords = ["static-analysis", "callgraph", "mcp", "code-intelligence", "pagerank"]
categories = ["development-tools", "command-line-utilities"]
default-run = "rw"
include = [
    "src/**/*",
    "vendor/grammars/**/*.c",
    "vendor/grammars/**/*.h",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "rw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
ignore = "0.4"
gix = "0.70"
lasso = { version = "0.7", features = ["multi-threaded", "serialize"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-cuda = "0.21"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23.2"

[build-dependencies]
cc = "1.7.0"

